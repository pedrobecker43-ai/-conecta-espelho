<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Conecta Towers · Localização</title><script>if(window.top===window.self&&!/[?&]solo/.test(location.search))location.replace('./');</script><style>:root{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#020b12}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: o mapa ocupa a tela; o painel de pontos e distâncias fica à direita (folha inferior no celular). Visual único, escuro, nos tons das torres. */
:root{color-scheme:dark;--bg:#020b12;--glass:rgba(4,16,24,.72);--line:rgba(120,220,255,.22);--line2:rgba(120,220,255,.5);--fg:#eaf6fb;--mut:#8fb0bf;--cy:#5ee6ff;--green:#3ee0a6;--gold:#f3c969;
  --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--serif:"Cormorant Garamond",Georgia,serif;--e:cubic-bezier(.2,.9,.25,1);
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;overflow:clip}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.top{position:absolute;inset:0 0 auto 0;z-index:6;display:flex;align-items:center;gap:14px;padding-block:14px 26px;padding-left:var(--gl);padding-right:var(--gr);background:linear-gradient(180deg,rgba(2,11,18,.96),rgba(2,11,18,.75) 60%,rgba(2,11,18,0));pointer-events:none}
.top img{height:34px;width:auto}
.top .tag{border:1px dashed var(--line2);border-radius:4px;padding:3px 8px}
#mapc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#mapc.drag{cursor:grabbing}
.mhud{position:absolute;left:var(--gl);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.mhud b{font:600 26px/1 var(--sans)}
.mzoom{position:absolute;z-index:4;left:var(--gl);top:84px;display:flex;flex-direction:column;gap:6px}
.mzoom button{width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--glass);backdrop-filter:blur(10px);font-size:18px;font-weight:600}
.mbx{position:absolute;z-index:4;left:var(--gl);bottom:4px;font:400 10px var(--mono);color:rgba(234,246,251,.75);text-decoration:none;text-shadow:0 0 4px #000}
@media (max-width:699.98px){.mbx{bottom:calc(46% + 2px)}}
.mzoom #mSat{width:auto;padding:0 10px;font-size:11.5px;font-weight:600;letter-spacing:.04em}
.mzoom #mSat.on{border-color:var(--cy);color:var(--cy)}
.mzoom button:hover{border-color:var(--cy);background:rgba(94,230,255,.14)}
.mpanel{position:absolute;z-index:5;right:0;top:0;bottom:0;width:min(390px,38%);box-sizing:border-box;padding:76px var(--gr) 18px 22px;display:flex;flex-direction:column;gap:12px;background:rgba(3,18,27,.95);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .8s var(--e);overflow:auto}
.mpanel.in{transform:none}
.mpanel h1{margin:0;font:600 30px/1.05 var(--sans);text-wrap:balance}
.mpanel h1 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--gold);font-size:1.12em}
.mpanel p{margin:0;color:var(--mut);font-size:13px}
.filt{display:flex;flex-wrap:wrap;gap:7px}
.filt button{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500}
.filt button.on{border-color:var(--cy);background:rgba(94,230,255,.16);color:var(--cy)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);width:100%}
.prow:hover,.prow.sel{background:rgba(94,230,255,.1)}
.prow .ic{width:26px;height:26px;box-sizing:border-box;padding:5px;border-radius:50%;border:1px solid var(--c);background:rgba(2,11,18,.6);fill:none;stroke:var(--c);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.prow .nm{font-weight:600;font-size:13.5px;min-width:0}
.prow .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--mut)}
.prow .ds{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.prow .ds small{display:block;font:400 10.5px var(--mono);color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts>*{flex:1 1 130px;text-align:center}
.btn{border:1px solid var(--line2);border-radius:8px;padding:10px 14px;font-weight:600;background:var(--glass);color:inherit;text-decoration:none;display:block}
.btn:hover{border-color:var(--cy);background:rgba(94,230,255,.12)}
.note{font-size:11.5px!important}
@media (max-width:699.98px){
  .mpanel{top:auto;left:0;width:auto;height:46%;padding:14px var(--gr) calc(14px + env(safe-area-inset-bottom,0px)) var(--gl);border-left:0;border-top:1px solid var(--line2);transform:translateY(100%)}
  .mpanel h1{font-size:23px}.mhud{bottom:calc(46% + 12px)}.mhud b{font-size:18px}.mzoom{top:68px}.top .tag{display:none}
}
@media (min-width:700px) and (max-width:1180px),(min-width:700px) and (max-height:700px){.mpanel{width:min(330px,40%);padding:66px var(--gr) 14px 18px;gap:9px}.mpanel h1{font-size:24px}.prow{padding:7px 4px}.mhud b{font-size:20px}.mzoom{top:70px}}
@media (prefers-reduced-motion:reduce){.mpanel{transition-duration:.01s}}
</style>
<style>
#mTour{position:absolute;z-index:8;left:0;right:0;bottom:0;display:none;padding:70px max(26px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(2,11,18,0),rgba(2,11,18,.9) 38%,rgba(2,11,18,.97));pointer-events:none}
#app.tour #mTour{display:block}#app.tour .mpanel,#app.tour .mhud,#app.tour .mbx{display:none!important}
#mTour>*{pointer-events:auto}
#mTour .pg{display:flex;gap:4px;margin-bottom:14px}#mTour .pg i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}#mTour .pg i u{display:block;height:100%;width:0;background:#f2c46b}
#mTour .mono{color:#5ee6ff}
#mTour h2{margin:6px 0 4px;font:500 clamp(30px,5vw,60px)/1.02 "Cormorant Garamond",Georgia,serif;color:#fff}
#mTour b{display:block;font:700 clamp(17px,2.2vw,24px) "Space Grotesk",sans-serif;color:#f2c46b}
#mTour p{margin:6px 0 0;max-width:46em;color:#cfe3ec;font-size:clamp(14px,1.5vw,17px);line-height:1.45}
#mTour .bt{display:flex;gap:8px;margin-top:14px;align-items:center}
#mTour .bt button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(94,230,255,.35);background:rgba(2,11,18,.7);color:#fff;font-size:20px;cursor:pointer}
#mTour .bt .x{width:auto;padding:0 18px;border-radius:999px;font:600 13px "Space Grotesk",sans-serif;margin-left:auto}
.btn.tourb{border-color:#f2c46b!important;color:#f2c46b!important}
</style>

  function loop(){const now=performance.now();/* nunca o relógio do requestAnimationFrame: dentro de um iframe ele pode ter outra origem */if(visible()){step(now);if(okCam(cam))draw(now)}else if(fly){fly.t=now-Math.min(now-fly.t,fly.ms*.2)}raf=requestAnimationFrame(loop)}
  function arrive(){arrived=0;sel=null;panel.classList.remove('in');const W=app.clientWidth,H=app.clientHeight,k0=Math.max(Math.min(W,H)/62000,W/86000,H/86000);cam={k:k0,x:(SATL[1].box[0]+SATL[1].box[2])/2,y:(SATL[1].box[1]+SATL[1].box[3])/2};fly=null;renderPanel();
    setTimeout(()=>{flyTo(home(),matchMedia('(prefers-reduced-motion:reduce)').matches?10:4600)},650)}
  function renderPanel(){

     <div class="filt">${cats.filter(c=>c==='all'||(M.poi[c]||[]).length).map(c=>`<button type="button" data-c="${c}"${cat===c?' class="on"':''}>${c==='all'?'Tudo':CAT[c][0]}</button>`).join('')}</div>
     <div class="list">${l.map(p=>`<button type="button" class="prow${sel===p?' sel':''}" data-p="${M.list.indexOf(p)}" style="--c:${CAT[p.c][1]}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICO[ico(p)]}"/></svg><span class="nm">${p.n}<small>${CAT[p.c][0]}</small></span><span class="ds">${p.door?'na porta':km(p.d)}<small>${tm(p)}</small></span></button>`).join('')}</div>
     <div class="acts"><button class="btn tourb" type="button" data-a="tour">▶ Tour pela região</button><button class="btn" type="button" data-a="again">Rever chegada</button><a class="btn" href="https://www.google.com/maps/search/?api=1&query=-27.1607361,-48.5988165" target="_blank" rel="noopener">Abrir no Google Maps</a></div>
     <p class="note">Distâncias e tempos de carro, estimados sem trânsito. Imagem de satélite: <a href="https://www.mapbox.com/about/maps/" target="_blank" rel="noopener" style="color:inherit">© Mapbox</a> © Maxar <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:inherit">© OpenStreetMap</a>.</p>`}
  function target(){if(!sel)return cat==='all'?home():catFit();const p=sel;
    let x0=0,y0=0,x1=0,y1=0;for(let i=0;i<p.r.length;i+=2){x0=Math.min(x0,p.r[i]);x1=Math.max(x1,p.r[i]);y0=Math.min(y0,p.r[i+1]);y1=Math.max(y1,p.r[i+1])}
    const f=fit(x0-120,y0-120,x1+120,y1+120,1.3);f.k=Math.min(f.k,1.1);return fit2(f,x0,y0,x1,y1)}
  const fit2=(f,x0,y0,x1,y1)=>{const g=free(),W=app.clientWidth,H=app.clientHeight;return{k:f.k,x:(x0+x1)/2-((g.x+g.w/2)-W/2)/f.k,y:(y0+y1)/2-((g.y+g.h/2)-H/2)/f.k}};
  function pick(p){if(!arrived)return;sel=p;renderPanel();const r=panel.querySelector('.prow.sel');if(r&&wide()){const a=r.offsetTop,b=a+r.offsetHeight;if(a<panel.scrollTop+70)panel.scrollTop=Math.max(0,a-70);else if(b>panel.scrollTop+panel.clientHeight)panel.scrollTop=b-panel.clientHeight+8}flyTo(target(),850)}
  const catFit=()=>{let x0=-300,y0=-300,x1=300,y1=300;for(const p of shown()){if(p.np)continue;x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}const f=fit(x0,y0,x1,y1,1.3);f.k=Math.min(f.k,.6);return fit2(f,x0,y0,x1,y1)};
  panel.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){if(!arrived)return;cat=c.dataset.c;sel=null;arrived=performance.now()-200;renderPanel();panel.scrollTop=0;flyTo(target(),900);return}

  /* arrastar, roda e pinça */
  const pts=new Map();let moved=0,pd=0;
  const zoomAt=(f,x,y)=>{fly=null;const W=app.clientWidth,H=app.clientHeight,wx=cam.x+(x-W/2)/cam.k,wy=cam.y+(y-H/2)/cam.k;cam.k=Math.max(Math.max(W,H)/200000,Math.min(3,cam.k*f));cam.x=wx-(x-W/2)/cam.k;cam.y=wy-(y-H/2)/cam.k};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;cv.classList.add('drag');if(pts.size===2){const [a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
  cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);

  async function init(){try{await load()}catch(x){panel.innerHTML='<p>Não foi possível carregar o mapa. Verifique a conexão e recarregue a página.</p>';panel.classList.add('in');return}

  let lw=0,lh=0,rt=0;const onSize=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!visible())return;const W=app.clientWidth,H=app.clientHeight;if(Math.abs(W-lw)<8&&Math.abs(H-lh)<90)return;lw=W;lh=H;if(arrived)flyTo(target(),okCam(cam)?300:1)},160)};addEventListener('resize',onSize);if(window.ResizeObserver)new ResizeObserver(onSize).observe(app);

   ['Trevo da BR-101','O acesso à BR-101: Florianópolis para um lado, Balneário Camboriú para o outro.'],['Porto Belo Lagos/Ecossistema Neymar Jr.','O novo vizinho, do outro lado da BR-101.'],['Porto Belo Golf All Resort','Resort de golfe na vizinhança.'],['Condomínio Aeronáutico Costa Esmeralda','Pista para aviação executiva, a poucos minutos.'],
   ['Praia do Perequê','A praia mais próxima: mar calmo, a seis minutos.'],['Píer da Meia Praia','Orla, restaurantes e o píer, na divisa com Itapema.'],['Centro de Porto Belo','Centro histórico, comércio e a orla da cidade.'],['Bombinhas','As praias de Bombinhas começam a quinze minutos.'],
   ['Balneário Camboriú','A cidade dos arranha-céus, a 25 minutos.'],['Aeroporto de Navegantes','Voos diários, a 35 minutos.'],['Aeroporto de Florianópolis','O aeroporto internacional da capital.']];
  const TD=6200;

    i=Math.max(0,i);tour.i=i;tour.t=0;tour.end=0;const [p,dsc]=st[i];sel=p;$('#mTk').textContent=CAT[p.c][0]+' · '+(i+1)+' / '+st.length;$('#mTh').textContent=p.n;$('#mTd').textContent=(p.door?'na porta':km(p.d))+' · '+tm(p);$('#mTp').textContent=dsc;
